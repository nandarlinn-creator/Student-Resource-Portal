<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Student Resource Portal</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .main-wrap {
      flex: 1;
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: calc(100vh - 69px);
    }

    /* ── Sidebar ── */
    aside {
      border-right: 1px solid var(--border);
      padding: 28px 16px;
      background: var(--card);
    }
    .sidebar-label {
      font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); padding: 0 12px; margin-bottom: 8px;
    }
    .sidebar-link {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px;
      text-decoration: none; color: var(--muted);
      font-size: 0.88rem; transition: all 0.2s; margin-bottom: 2px;
      background: none; border: none; width: 100%; cursor: pointer;
    }
    .sidebar-link:hover { background: var(--border); color: var(--text); }
    .sidebar-link.active { background: rgba(59,130,246,0.12); color: var(--accent); }
    .sidebar-link .icon { width: 20px; text-align: center; }

    .sidebar-badge {
      margin-left: auto;
      background: var(--danger);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      min-width: 20px;
      text-align: center;
    }

    /* ── Content ── */
    .content { padding: 40px 48px; overflow-y: auto; }

    .page-header { margin-bottom: 32px; }
    .page-header h1 {
      font-family: var(--font-head); font-size: 1.9rem;
      font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px;
    }
    .page-header p { color: var(--muted); font-size: 0.9rem; }

    /* ── Stats ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 36px;
    }
    .stat-tile {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .stat-tile::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }
    .stat-tile.blue::before  { background: var(--accent); }
    .stat-tile.amber::before { background: var(--warning); }
    .stat-tile.green::before { background: var(--success); }
    .stat-tile.red::before   { background: var(--danger); }

    .stat-num {
      font-family: var(--font-head);
      font-size: 2rem; font-weight: 800; line-height: 1;
      margin-bottom: 4px;
    }
    .stat-lbl { font-size: 0.78rem; color: var(--muted); font-weight: 500; }

    /* ── Tabs ── */
    .tabs {
      display: flex; gap: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
      width: fit-content;
    }
    .tab {
      padding: 8px 20px; border-radius: 7px;
      border: none; background: none;
      color: var(--muted); font-size: 0.88rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--bg); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
    .tab-count {
      background: var(--border);
      border-radius: 99px;
      padding: 1px 7px;
      font-size: 0.72rem;
    }
    .tab.active .tab-count { background: rgba(59,130,246,0.2); color: var(--accent); }

    /* ── Project Table ── */
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .table-toolbar {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .search-wrap { position: relative; flex: 1; max-width: 320px; }
    .search-wrap input { padding-left: 38px; }
    .search-icon {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); font-size: 0.85rem;
    }

    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--bg2); }
    th {
      padding: 12px 20px;
      text-align: left;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    td {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      font-size: 0.88rem;
      vertical-align: middle;
    }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .project-title-cell { max-width: 260px; }
    .project-title-cell .title {
      font-weight: 500; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .project-title-cell .desc {
      font-size: 0.78rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .uploader-cell { display: flex; align-items: center; gap: 8px; }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .uploader-name { font-weight: 500; }
    .uploader-email { font-size: 0.75rem; color: var(--muted); }

    /* ── Action Buttons ── */
    .action-btns { display: flex; gap: 6px; }

    .btn-approve, .btn-reject, .btn-pending {
      padding: 6px 14px; border-radius: 7px;
      font-size: 0.8rem; font-weight: 500;
      border: 1px solid; cursor: pointer;
      transition: all 0.15s; white-space: nowrap;
    }
    .btn-approve {
      background: rgba(16,185,129,0.1);
      border-color: rgba(16,185,129,0.3);
      color: var(--success);
    }
    .btn-approve:hover { background: rgba(16,185,129,0.2); }

    .btn-reject {
      background: rgba(239,68,68,0.1);
      border-color: rgba(239,68,68,0.3);
      color: var(--danger);
    }
    .btn-reject:hover { background: rgba(239,68,68,0.2); }

    .btn-pending {
      background: rgba(245,158,11,0.1);
      border-color: rgba(245,158,11,0.3);
      color: var(--warning);
    }
    .btn-pending:hover { background: rgba(245,158,11,0.2); }

    /* ── Empty / Loading ── */
    .table-empty {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 0.9rem;
    }
    .table-empty .icon { font-size: 2rem; margin-bottom: 8px; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 28px; right: 28px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 20px;
      font-size: 0.88rem; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transform: translateY(80px); opacity: 0;
      transition: all 0.3s; z-index: 999;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(16,185,129,0.4); }
    .toast.error   { border-color: rgba(239,68,68,0.4); }

    /* ── Mobile card list (shown instead of table on small screens) ── */
    .card-list { display: none; }
    .project-card-admin {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .project-card-admin .pc-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 10px; margin-bottom: 10px;
    }
    .project-card-admin .pc-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
    .project-card-admin .pc-desc { font-size: 0.8rem; color: var(--muted); }
    .project-card-admin .pc-meta {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-size: 0.78rem; color: var(--muted); margin: 10px 0;
      padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .project-card-admin .pc-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .project-card-admin .pc-actions button { flex: 1; min-width: 90px; padding: 10px 12px; font-size: 0.85rem; }

    @media (max-width: 1100px) { .stats-row { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 768px) {
      .main-wrap { grid-template-columns: 1fr; }
      aside { display: none; }
      .content { padding: 20px 14px; }
      .stats-row { grid-template-columns: repeat(2,1fr); }
      .tabs { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .table-toolbar { flex-direction: column; align-items: stretch; }
      .search-wrap { max-width: none; }

      /* Hide table, show cards instead */
      .table-wrap table { display: none; }
      .card-list { display: block; padding: 4px; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="page-wrap">
    <nav>
      <a href="/" class="nav-logo"><span></span>UniPortal <span style="font-size:0.7rem;background:rgba(239,68,68,0.2);color:#fca5a5;padding:2px 8px;border-radius:99px;margin-left:8px;font-weight:600;">ADMIN</span></a>
      <div class="nav-links">
        <a href="/projects">View Site</a>
        <button class="btn-nav-primary" onclick="logout()">Sign Out</button>
      </div>
    </nav>

    <div class="main-wrap">
      <!-- Sidebar -->
      <aside>
        <div style="margin-bottom:28px;">
          <p class="sidebar-label">Admin Panel</p>
          <button class="sidebar-link active" onclick="switchTab('all')">
            <span class="icon">📊</span> All Projects
          </button>
          <button class="sidebar-link" id="side-pending" onclick="switchTab('pending')">
            <span class="icon">⏳</span> Pending
            <span class="sidebar-badge" id="pendingBadge">0</span>
          </button>
          <button class="sidebar-link" onclick="switchTab('approved')">
            <span class="icon">✅</span> Approved
          </button>
          <button class="sidebar-link" onclick="switchTab('rejected')">
            <span class="icon">❌</span> Rejected
          </button>
        </div>
        <div>
          <p class="sidebar-label">Site</p>
          <a href="/projects" class="sidebar-link">
            <span class="icon">🌐</span> Public View
          </a>
          <button class="sidebar-link" onclick="logout()">
            <span class="icon">🚪</span> Sign Out
          </button>
        </div>
      </aside>

      <!-- Main -->
      <main class="content">
        <div class="page-header fade-up">
          <h1>Project Reviews</h1>
          <p>Approve or reject submitted student projects before they appear publicly.</p>
        </div>

        <!-- Stats -->
        <div class="stats-row fade-up delay-1">
          <div class="stat-tile blue">
            <div class="stat-num" id="statTotal">—</div>
            <div class="stat-lbl">Total Projects</div>
          </div>
          <div class="stat-tile amber">
            <div class="stat-num" id="statPending">—</div>
            <div class="stat-lbl">Pending Review</div>
          </div>
          <div class="stat-tile green">
            <div class="stat-num" id="statApproved">—</div>
            <div class="stat-lbl">Approved</div>
          </div>
          <div class="stat-tile red">
            <div class="stat-num" id="statRejected">—</div>
            <div class="stat-lbl">Rejected</div>
          </div>
        </div>

        <!-- Tabs -->
        <div class="tabs fade-up delay-2">
          <button class="tab active" id="tab-all"      onclick="switchTab('all')">All <span class="tab-count" id="cnt-all">0</span></button>
          <button class="tab"        id="tab-pending"  onclick="switchTab('pending')">Pending <span class="tab-count" id="cnt-pending">0</span></button>
          <button class="tab"        id="tab-approved" onclick="switchTab('approved')">Approved <span class="tab-count" id="cnt-approved">0</span></button>
          <button class="tab"        id="tab-rejected" onclick="switchTab('rejected')">Rejected <span class="tab-count" id="cnt-rejected">0</span></button>
        </div>

        <!-- Table -->
        <div class="table-wrap fade-up delay-3">
          <div class="table-toolbar">
            <div class="search-wrap">
              <span class="search-icon">🔍</span>
              <input type="text" id="searchInput" placeholder="Search projects or uploaders..." oninput="renderTable()" />
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th>Project</th>
                <th>Uploaded By</th>
                <th>File</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="6"><div class="table-empty"><div class="icon">⏳</div>Loading...</div></td></tr>
            </tbody>
          </table>
          <div class="card-list" id="cardList"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    let allProjects = [];
    let currentTab  = 'all';

    /* ── Init ── */
    async function init() {
      await Promise.all([loadStats(), loadProjects()]);
    }

    /* ── Stats ── */
    async function loadStats() {
      try {
        const res  = await fetch('/admin/api/stats');
        const data = await res.json();
        document.getElementById('statTotal').textContent    = data.total    ?? 0;
        document.getElementById('statPending').textContent  = data.pending  ?? 0;
        document.getElementById('statApproved').textContent = data.approved ?? 0;
        document.getElementById('statRejected').textContent = data.rejected ?? 0;
        document.getElementById('pendingBadge').textContent = data.pending  ?? 0;
      } catch(e) { console.error(e); }
    }

    /* ── Projects ── */
    async function loadProjects() {
      try {
        const res  = await fetch('/admin/api/projects');
        const data = await res.json();
        allProjects = data.projects || [];
        updateCounts();
        renderTable();
      } catch(e) {
        document.getElementById('tableBody').innerHTML =
          `<tr><td colspan="6"><div class="table-empty"><div class="icon">❌</div>Failed to load projects.</div></td></tr>`;
      }
    }

    /* ── Tab switch ── */
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + tab)?.classList.add('active');
      renderTable();
    }

    /* ── Counts ── */
    function updateCounts() {
      const counts = { all: allProjects.length, pending: 0, approved: 0, rejected: 0 };
      allProjects.forEach(p => counts[p.status] = (counts[p.status] || 0) + 1);
      ['all','pending','approved','rejected'].forEach(k => {
        const el = document.getElementById('cnt-' + k);
        if (el) el.textContent = counts[k];
      });
    }

    /* ── Render table + mobile cards ── */
    function renderTable() {
      const query    = document.getElementById('searchInput').value.toLowerCase();
      const tbody    = document.getElementById('tableBody');
      const cardList = document.getElementById('cardList');

      let filtered = allProjects.filter(p => {
        if (currentTab !== 'all' && p.status !== currentTab) return false;
        if (query) {
          const haystack = [p.title, p.description, p.uploader?.name, p.uploader?.email]
            .filter(Boolean).join(' ').toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="table-empty">
          <div class="icon">📭</div>No projects found.</div></td></tr>`;
        cardList.innerHTML = `<div class="table-empty"><div class="icon">📭</div>No projects found.</div>`;
        return;
      }

      tbody.innerHTML = filtered.map(p => {
        const author   = p.uploader?.name  || 'Unknown';
        const email    = p.uploader?.email || '';
        const av       = initials(author);
        const ext      = (p.file_name || '').split('.').pop().toUpperCase();
        const date     = p.created_at ? new Date(p.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—';

        const approveBtn = p.status !== 'approved'
          ? `<button class="btn-approve" onclick="updateStatus(${p.id},'approved')">✓ Approve</button>` : '';
        const rejectBtn = p.status !== 'rejected'
          ? `<button class="btn-reject"  onclick="updateStatus(${p.id},'rejected')">✕ Reject</button>`  : '';
        const pendingBtn = p.status !== 'pending'
          ? `<button class="btn-pending" onclick="updateStatus(${p.id},'pending')">↺ Pending</button>`  : '';

        return `
          <tr id="row-${p.id}">
            <td class="project-title-cell">
              <div class="title">${esc(p.title)}</div>
              <div class="desc">${esc(p.description || 'No description')}</div>
            </td>
            <td>
              <div class="uploader-cell">
                <div class="avatar">${av}</div>
                <div>
                  <div class="uploader-name">${esc(author)}</div>
                  <div class="uploader-email">${esc(email)}</div>
                </div>
              </div>
            </td>
            <td><span style="background:var(--border);padding:3px 8px;border-radius:6px;font-size:0.75rem;font-weight:600;">${ext}</span></td>
            <td style="color:var(--muted);white-space:nowrap;">${date}</td>
            <td><span class="badge badge-${p.status}">${p.status}</span></td>
            <td><div class="action-btns">${approveBtn}${rejectBtn}${pendingBtn}</div></td>
          </tr>`;
      }).join('');

      // ── Mobile cards (always-visible action buttons, no clipping) ──
      cardList.innerHTML = filtered.map(p => {
        const author   = p.uploader?.name  || 'Unknown';
        const email    = p.uploader?.email || '';
        const ext      = (p.file_name || '').split('.').pop().toUpperCase();
        const date     = p.created_at ? new Date(p.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—';

        const approveBtn = p.status !== 'approved'
          ? `<button class="btn-approve" onclick="updateStatus(${p.id},'approved')">✓ Approve</button>` : '';
        const rejectBtn = p.status !== 'rejected'
          ? `<button class="btn-reject"  onclick="updateStatus(${p.id},'rejected')">✕ Reject</button>`  : '';
        const pendingBtn = p.status !== 'pending'
          ? `<button class="btn-pending" onclick="updateStatus(${p.id},'pending')">↺ Pending</button>`  : '';

        return `
          <div class="project-card-admin" id="card-${p.id}">
            <div class="pc-top">
              <div>
                <div class="pc-title">${esc(p.title)}</div>
                <div class="pc-desc">${esc(p.description || 'No description')}</div>
              </div>
              <span class="badge badge-${p.status}">${p.status}</span>
            </div>
            <div class="pc-meta">
              <span>👤 ${esc(author)}</span>
              <span>${ext}</span>
              <span>${date}</span>
            </div>
            <div class="pc-actions">${approveBtn}${rejectBtn}${pendingBtn}</div>
          </div>`;
      }).join('');
    }

    /* ── Update status ── */
    async function updateStatus(id, status) {
      try {
        const res = await fetch(`/admin/api/projects/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status }),
        });

        if (!res.ok) throw new Error('Failed');

        // Update local data
        const proj = allProjects.find(p => p.id === id);
        if (proj) proj.status = status;

        updateCounts();
        renderTable();
        loadStats();

        showToast(`Project ${status} successfully.`, 'success');
      } catch(e) {
        showToast('Failed to update status. Try again.', 'error');
      }
    }

    /* ── Helpers ── */
    function initials(name) {
      return (name || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = (type === 'success' ? '✓ ' : '✕ ') + msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    async function logout() {
      await fetch('/auth/logout', { method: 'POST' });
      window.location.href = '/auth/login';
    }

    init();
  </script>
</body>
</html>
