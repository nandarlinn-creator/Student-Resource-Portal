<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — UniPortal</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .shell { max-width: 760px; }

    .page-header { margin-bottom: 28px; }
    .page-header h1 { font-family: var(--font-head); font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; color: var(--ink); }
    .page-header p { color: var(--muted); font-size: 0.92rem; }

    .profile-hero { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 30px; margin-bottom: 22px; display: flex; align-items: center; gap: 20px; box-shadow: var(--shadow-sm); }
    .profile-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; color: #fff; flex-shrink: 0; }
    .profile-name { font-family: var(--font-head); font-size: 1.35rem; font-weight: 800; margin-bottom: 4px; color: var(--ink); }
    .profile-email { color: var(--muted); font-size: 0.88rem; margin-bottom: 8px; }
    .role-badge { display: inline-block; padding: 3px 12px; border-radius: 99px; font-size: 0.74rem; font-weight: 700; text-transform: capitalize; background: #DBEAFE; color: var(--primary); }
    .role-badge.admin   { background: var(--danger-bg);  color: #991B1B; }
    .role-badge.faculty { background: var(--success-bg); color: #166534; }

    .profile-contact { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    .contact-item { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; color: var(--muted); }
    .contact-icon { font-size: 0.9rem; flex-shrink: 0; }

    .btn-edit-profile {
      padding: 9px 18px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--white); color: var(--ink); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s; white-space: nowrap; align-self: flex-start;
    }
    .btn-edit-profile:hover { background: var(--bg-soft); border-color: var(--primary); color: var(--primary); }

    @media (max-width: 768px) {
      .profile-hero { position: relative; padding-top: 56px; }
      .btn-edit-profile { position: absolute; top: 16px; right: 16px; }
    }

    .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 22px; }
    .stat-tile { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; box-shadow: var(--shadow-sm); }
    .stat-num { font-family: var(--font-head); font-size: 1.7rem; font-weight: 800; margin-bottom: 4px; color: var(--ink); }
    .stat-lbl { font-size: 0.78rem; color: var(--muted); font-weight: 600; }

    .section-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 26px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
    .section-title { font-family: var(--font-head); font-size: 1rem; font-weight: 700; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); color: var(--ink); }

    .my-project-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); text-decoration: none; color: inherit; transition: background 0.15s; }
    .my-project-row:last-child { border-bottom: none; }
    .my-project-row:hover { background: var(--bg-soft); }
    .mp-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mp-icon { width: 38px; height: 38px; border-radius: 9px; background: #DBEAFE; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .mp-title { font-size: 0.9rem; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mp-date { font-size: 0.76rem; color: var(--muted); }
    .empty-projects { text-align: center; padding: 32px; color: var(--muted); font-size: 0.88rem; }

    .form-row { display: grid; gap: 16px; max-width: 420px; }

    .loading-state { text-align: center; padding: 60px; color: var(--muted); }
    .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 14px; }

    @media (max-width: 768px) {
      .stats-row { grid-template-columns: 1fr; }
      .profile-hero { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <nav class="topnav">
      <a href="/" class="nav-logo"><span>🎓</span>UniPortal</a>
      <div class="nav-links">
        <a href="/projects">Projects</a>
        <a href="/projects/upload">Upload Project</a>
        <a href="/profile" class="active">My Profile</a>
        <button class="btn-nav-primary" onclick="logout()">Sign Out</button>
      </div>
    </nav>

    <main class="shell" id="mainContent">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading profile...</p>
      </div>
    </main>
  </div>

<script>
  async function loadProfile() {
    try {
      const res  = await fetch('/profile/api/me', { headers: { 'Accept': 'application/json' } });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load profile');
      renderProfile(data);
    } catch (err) {
      document.getElementById('mainContent').innerHTML =
        '<div class="loading-state"><p>Error: ' + esc(err.message) + '</p></div>';
    }
  }

  function renderProfile(data) {
    const user = data.user;
    const projects = data.projects || [];
    const av = initials(user.name);

    const approved = projects.filter(p => p.status === 'approved').length;
    const pending  = projects.filter(p => p.status === 'pending').length;

    document.getElementById('mainContent').innerHTML = `
      <div class="page-header fade-up">
        <h1>My Profile</h1>
        <p>Manage your account and view your submitted projects.</p>
      </div>

      <div class="profile-hero fade-up delay-1">
        <div class="profile-avatar">${av}</div>
        <div style="flex:1;">
          <div class="profile-name">${esc(user.name)}</div>
          <div class="profile-email">${esc(user.email)}</div>
          <span class="role-badge ${user.role}">${esc(user.role)}</span>
          <div class="profile-contact">
            <div class="contact-item">
              <span class="contact-icon">📞</span>
              <span>${user.phone ? esc(user.phone) : 'No phone number added'}</span>
            </div>
            <div class="contact-item">
              <span class="contact-icon">📍</span>
              <span>${user.address ? esc(user.address) : 'No address added'}</span>
            </div>
          </div>
        </div>
        <button class="btn-edit-profile" onclick="openEditForm()">✏️ Edit Profile</button>
      </div>

      <!-- Edit form (hidden until Edit Profile is clicked) -->
      <div class="section-card fade-up delay-1" id="editFormCard" style="display:none;">
        <div class="section-title">✏️ Edit Profile Details</div>
        <div class="alert alert-error"   id="editError"   style="display:none;"><span>⚠</span><span id="editErrorMsg"></span></div>
        <div class="alert alert-success" id="editSuccess" style="display:none;"><span>✓</span><span>Profile updated successfully.</span></div>
        <div class="form-row">
          <div class="form-group" style="margin:0;">
            <label for="editName">Full Name</label>
            <input type="text" id="editName" value="${esc(user.name)}" placeholder="Your full name" />
          </div>
          <div class="form-group" style="margin:0;">
            <label for="editPhone">Phone Number</label>
            <input type="text" id="editPhone" value="${user.phone ? esc(user.phone) : ''}" placeholder="e.g. +95 9 123 456 789" />
          </div>
          <div class="form-group" style="margin:0;">
            <label for="editAddress">Address</label>
            <textarea id="editAddress" placeholder="Your address" style="min-height:80px;">${user.address ? esc(user.address) : ''}</textarea>
          </div>
          <div style="display:flex;gap:10px;">
            <button class="btn btn-primary" style="width:fit-content;" onclick="saveProfile()">Save Changes</button>
            <button class="btn-secondary" style="border-radius:10px;padding:12px 24px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--white);" onclick="closeEditForm()">Cancel</button>
          </div>
        </div>
      </div>

      <div class="stats-row fade-up delay-2">
        <div class="stat-tile"><div class="stat-num">${projects.length}</div><div class="stat-lbl">Total Submitted</div></div>
        <div class="stat-tile"><div class="stat-num">${approved}</div><div class="stat-lbl">Approved</div></div>
        <div class="stat-tile"><div class="stat-num">${pending}</div><div class="stat-lbl">Pending Review</div></div>
      </div>

      <div class="section-card fade-up delay-3">
        <div class="section-title">📁 My Projects</div>
        ${renderMyProjects(projects)}
      </div>

      <div class="section-card fade-up delay-3">
        <div class="section-title">🔒 Change Password</div>
        <div class="alert alert-error"   id="pwError"   style="display:none;"><span>⚠</span><span id="pwErrorMsg"></span></div>
        <div class="alert alert-success" id="pwSuccess" style="display:none;"><span>✓</span><span>Password updated successfully.</span></div>
        <div class="form-row">
          <div class="form-group" style="margin:0;">
            <label for="currentPw">Current Password</label>
            <input type="password" id="currentPw" placeholder="••••••••" />
          </div>
          <div class="form-group" style="margin:0;">
            <label for="newPw">New Password</label>
            <input type="password" id="newPw" placeholder="Min. 8 characters" />
          </div>
          <div class="form-group" style="margin:0;">
            <label for="confirmPw">Confirm New Password</label>
            <input type="password" id="confirmPw" placeholder="Repeat new password" />
          </div>
          <button class="btn btn-primary" style="width:fit-content;" onclick="changePassword()">Update Password</button>
        </div>
      </div>
    `;
  }

  /* ── Edit profile form ── */
  function openEditForm() {
    document.getElementById('editFormCard').style.display = 'block';
    document.getElementById('editFormCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function closeEditForm() {
    document.getElementById('editFormCard').style.display = 'none';
    document.getElementById('editError').style.display = 'none';
    document.getElementById('editSuccess').style.display = 'none';
  }

  async function saveProfile() {
    const name    = document.getElementById('editName').value.trim();
    const phone   = document.getElementById('editPhone').value.trim();
    const address = document.getElementById('editAddress').value.trim();

    document.getElementById('editError').style.display   = 'none';
    document.getElementById('editSuccess').style.display = 'none';

    if (name.length < 2) return showEditError('Name must be at least 2 characters.');

    try {
      const res = await fetch('/profile/api/me', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, address }),
      });
      const data = await res.json();
      if (!res.ok) return showEditError(data.error || 'Failed to update profile.');

      document.getElementById('editSuccess').style.display = 'flex';
      setTimeout(() => loadProfile(), 900); // refresh the page with new data
    } catch (err) {
      showEditError('Network error. Please try again.');
    }
  }

  function showEditError(msg) {
    const el = document.getElementById('editError');
    document.getElementById('editErrorMsg').textContent = msg;
    el.style.display = 'flex';
  }

  function renderMyProjects(projects) {
    if (!projects.length) {
      return '<div class="empty-projects">You have not submitted any projects yet. <a href="/projects/upload" style="color:var(--primary);font-weight:600;">Upload one now</a>.</div>';
    }
    return projects.map(p => {
      const date = p.created_at ? new Date(p.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : '';
      return `
        <a href="/projects/${p.id}" class="my-project-row">
          <div class="mp-left">
            <div class="mp-icon">📄</div>
            <div>
              <div class="mp-title">${esc(p.title)}</div>
              <div class="mp-date">${date}</div>
            </div>
          </div>
          <span class="badge badge-${p.status}">${p.status}</span>
        </a>`;
    }).join('');
  }

  async function changePassword() {
    const current = document.getElementById('currentPw').value;
    const next     = document.getElementById('newPw').value;
    const confirm  = document.getElementById('confirmPw').value;

    document.getElementById('pwError').style.display   = 'none';
    document.getElementById('pwSuccess').style.display = 'none';

    if (!current || !next || !confirm) return showPwError('Please fill in all fields.');
    if (next.length < 8) return showPwError('New password must be at least 8 characters.');
    if (next !== confirm) return showPwError('Passwords do not match.');

    try {
      const res = await fetch('/profile/api/password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentPassword: current, newPassword: next }),
      });
      const data = await res.json();
      if (!res.ok) return showPwError(data.error || 'Failed to update password.');

      document.getElementById('pwSuccess').style.display = 'flex';
      document.getElementById('currentPw').value = '';
      document.getElementById('newPw').value = '';
      document.getElementById('confirmPw').value = '';
    } catch (err) {
      showPwError('Network error. Please try again.');
    }
  }

  function showPwError(msg) {
    const el = document.getElementById('pwError');
    document.getElementById('pwErrorMsg').textContent = msg;
    el.style.display = 'flex';
  }

  function initials(name) {
    return (name || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
  }
  function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  async function logout() {
    await fetch('/auth/logout', { method: 'POST' });
    window.location.href = '/auth/login';
  }

  loadProfile();
</script>
</body>
</html>
